<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그</title>
  <!-- 화면 라이브러리·글꼴은 인터넷 없이도 되도록 저장소 안 파일만 씀 (static/vendor/README.md) -->
  <link rel="stylesheet" href="/vendor/pretendard-1.3.9/pretendard.css">
  <link rel="stylesheet" id="hljsLight" href="/vendor/highlight-11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" id="hljsDark" href="/vendor/highlight-11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <script>
    // 화면 모드(시스템/라이트/다크)를 그리기 전에 적용해서 깜빡임 방지
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
      window.applyTheme = function (mode) {
        var root = document.documentElement;
        if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
        else root.removeAttribute('data-theme');
        var light = document.getElementById('hljsLight'), dark = document.getElementById('hljsDark');
        if (light && dark) {
          light.media = mode === 'dark' ? 'not all' : mode === 'light' ? 'all' : '(prefers-color-scheme: light)';
          dark.media = mode === 'dark' ? 'all' : mode === 'light' ? 'not all' : '(prefers-color-scheme: dark)';
        }
      };
      window.applyTheme(t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css?v=21">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#/" class="logo" id="blogTitle">블로그</a>
      <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="검색" aria-label="블로그 검색">
      </form>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="화면 모드 바꾸기"></button>
      <nav class="top-actions" id="topActions"></nav>
    </div>
    <nav class="wrap type-nav" id="typeNav" aria-label="글 종류"></nav>
  </header>

  <div class="wrap layout">
    <main id="main" tabindex="-1"></main>
    <aside class="sidebar">
      <section class="side-box widget" id="widget" aria-label="오늘 날짜와 날씨"></section>
      <div id="sidebar"></div>
    </aside>
  </div>

  <footer class="footer"><div class="wrap" id="footer"></div></footer>
  <div class="toast" id="toast" role="status"></div>

  <script src="/vendor/marked-12.0.2/marked.min.js"></script>
  <script src="/vendor/dompurify-3.1.6/purify.min.js"></script>
  <script src="/vendor/highlight-11.9.0/highlight.min.js"></script>
  <script src="/miniroom.js?v=1"></script>
  <script src="/app.js?v=22"></script>
  <script src="/food.js?v=13"></script>
  <script src="/widget.js?v=9"></script>
</body>
</html>
